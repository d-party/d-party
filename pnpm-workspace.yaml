packages:
  - "extension"
  - "frontend"
  - "packages/*"

# ビルドスクリプトを実行してよい依存。宣言の無いものがスクリプトを持つと install が落ちる。
allowBuilds:
  esbuild: true

# 脆弱な推移的依存を修正版へ上げる。左辺のレンジに当たる解決結果だけを書き換える。
overrides:
  "brace-expansion@>=3.0.0 <5.0.9": ">=5.0.9"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "fast-uri@>=3.0.0 <3.1.9": ">=3.1.9 <4"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1"
  "linkify-it@<=5.0.1": ">=5.0.2"
  "nanoid@<3.3.18": ">=3.3.18"
  "postcss@<=8.5.22": ">=8.5.23"
  "sharp@<0.35.0": ">=0.35.0"
