packages:
  - "extension"
  - "frontend"
  - "packages/*"

# 公開から 7 日（分で指定）たつまで、その版を解決の候補にしない。既定は 1 日。
# .github/dependabot.yml の cooldown と揃えている。pnpm install はロックファイルの版も
# この条件で検査する。7 日より新しい版をどうしても入れるとき（セキュリティ修正）は、
# `minimumReleaseAgeExclude` に `name@version` の形で、その版だけを足す。
minimumReleaseAge: 10080

# ビルドスクリプトを実行してよい依存。宣言の無いものがスクリプトを持つと install が落ちる。
allowBuilds:
  esbuild: true

# 脆弱な推移的依存を修正版へ上げる。左辺のレンジに当たる解決結果だけを書き換える。
overrides:
  "brace-expansion@>=3.0.0 <5.0.9": ">=5.0.9"
  "esbuild@>=0.27.3 <0.28.1": ">=0.28.1"
  "fast-uri@>=3.0.0 <3.1.9": ">=3.1.9 <4"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1"
  "linkify-it@<=5.0.1": ">=5.0.2"
  "nanoid@<3.3.18": ">=3.3.18"
  "postcss@<=8.5.22": ">=8.5.23"
  "sharp@<0.35.0": ">=0.35.0"
