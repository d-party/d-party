# pre-commit hooks。
# Install: `pre-commit install`（リポジトリのルートで実行する）
# Run on everything: `pre-commit run --all-files`
#
# pre-commit はフックを `git rev-parse --git-dir` へ入れ、実行時の設定ファイルも
# リポジトリのルートから探すため、この設定はルートに置く必要がある。
#
# 適用範囲は **backend/ のみ**（`files: ^backend/`）。extension / frontend は
# prettier + eslint が担当しており、二重に整形すると衝突するため対象外にしている。
#
# ruff の詳細ルール（flake8 / flake8-django / flake8-bandit 等）は
# backend/pyproject.toml の [tool.ruff] を参照する。
minimum_pre_commit_version: "3.5.0"

files: '^backend/'

# ベンダー製 / 配信用静的アセット（jQuery・Bootstrap・Flickity 等の minified ライブラリ）は
# 整形対象から除外する。アプリのソースコードのみフックを適用する。
exclude: '^backend/web/static/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      # Lint（flake8 / flake8-django / flake8-bandit 等を ruff で再現。設定は pyproject.toml）
      - id: ruff-check
        args: [--fix]
      # Format（black 互換のスタイル）
      - id: ruff-format
