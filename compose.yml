x-env_file: &env_file ./.env.global

services:
  nginx:
    container_name: nginx
    # CVE-2026-123007（nginx2shell）の修正版以上に固定する。マイナー版のタグは古いキャッシュのまま動きうる。
    image: nginx:1.31.9
    ports:
      - "80:80"
    volumes:
      - "./nginx/:/etc/nginx/"
      - "./backend/static:/static"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_healthy
    env_file: *env_file
  django:
    container_name: django
    image: backend-django
    build:
      context: ./backend
    volumes:
      - ./backend/:/usr/src/app/
      - ./backend/.env.django:/env_files/.env.django
      - ./.env.global:/env_files/.env.global
    env_file:
      - ./backend/.env.django
      - *env_file
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  frontend:
    # image は override.yml が与える。
    container_name: frontend
    expose:
      - "3000"
    env_file: *env_file
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:18
    container_name: postgres
    volumes:
      # postgres:18 からはデータを /var/lib/postgresql/<版>/docker に置き、/var/lib/postgresql を
      # マウントする形になった（/var/lib/postgresql/data にマウントすると起動しない）。
      # 16 のときの ./postgres/data は使わなくなる。中身を移す手順は infra/README.md §3.6。
      - "./postgres/data18:/var/lib/postgresql"
    env_file: *env_file
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8.10
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
