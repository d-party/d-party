# 本番用（TLS 終端）。server ブロックは templates-prod/ を展開した conf.prod.d/ にある。
worker_processes auto;

user nobody nogroup;
pid /tmp/nginx.pid;
error_log /tmp/nginx.error.log;

events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx.access.log combined;
    sendfile on;

    # upstream はテンプレート側で env から定義する。Docker の DNS で遅延解決する。

    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.prod.d/*.conf;
}
