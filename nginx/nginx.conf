worker_processes 2;

user nobody nogroup;
pid /tmp/nginx.pid;
error_log /tmp/nginx.error.log;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx.access.log combined;
    sendfile on;

    # upstream と server は templates/ を envsubst で展開した conf.d/ にある。
    # upstream の名前解決は起動時の 1 回だけで、resolver は今は使われない（upstream の server に
    # resolve を付けて再解決させるなら要る）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/conf.d/*.conf;
}
