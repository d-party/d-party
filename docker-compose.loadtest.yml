# k6（loadtest profile）。使い方は loadtest/README.md。
# django を直接叩くなら LOADTEST_TARGET=ws://django:8000/anime-store/party/

services:
  k6:
    image: grafana/k6:2.3.0
    container_name: k6
    profiles: ["loadtest"]
    # マウントした ./loadtest（uid 1000）へ結果を書けるようにする。
    user: "1000:1000"
    volumes:
      - ./loadtest:/loadtest
    working_dir: /loadtest
    environment:
      TARGET: ${LOADTEST_TARGET:-ws://nginx/anime-store/party/}
      ROOM_SIZE: ${LOADTEST_ROOM_SIZE:-3}
      VUS: ${LOADTEST_VUS:-1}
      DURATION: ${LOADTEST_DURATION:-30s}
      PING_INTERVAL_MS: ${LOADTEST_PING_INTERVAL_MS:-1000}
      REACTION_INTERVAL_MS: ${LOADTEST_REACTION_INTERVAL_MS:-1500}
      ROOM_LOAD_MS: ${LOADTEST_ROOM_LOAD_MS:-8000}
    depends_on:
      django:
        condition: service_healthy
    # シナリオは LOADTEST_SCENARIO（ws_party.js / ws_oneway.js / ws_timer.js）。

    command:
      - run
      - --summary-export=/loadtest/results/summary.json
      - /loadtest/scenarios/${LOADTEST_SCENARIO:-ws_party.js}
