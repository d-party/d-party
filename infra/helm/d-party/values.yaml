# ─────────────────────────────────────────────────────────────────────────────
# d-party Helm values。TLS は cloudflared が終端し、chart はクラスタ内 HTTP だけを扱う。
# 機微値は secret.existingSecret で渡す（secret.* の平文は dev 用）。
# ─────────────────────────────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

# 共有の非機微 env（settings.py / nginx upstream 解決が参照）。
config:
  DEBUG: "0"
  # cloudflared が振り分けるホスト名。ALLOWED_HOSTS / CSRF に使われる。
  MY_DOMAIN: "d-party.example"
  # OGP の絶対 URL（SSR のみ）。未設定なら https://d-party.net。
  # SITE_URL: "https://d-party.example"
  LANGUAGE_CODE: "ja"
  TIME_ZONE: "Asia/Tokyo"
  TZ: "Asia/Tokyo"
  D_ANIME_STORE_DOMAIN: "animestore.docomo.ne.jp"
  CHROME_EXTENSION_REQUIRED_VERSION: "1.0.0"
  DATABASE_ENGINE: "django.db.backends.postgresql"

# 機微値。existingSecret を指定した場合 secret.* は無視される。
secret:
  # SECRET_KEY と POSTGRES_PASSWORD を持つ Secret。
  existingSecret: ""
  # existingSecret 未指定時に chart が生成する平文（dev 用途のみ）。
  SECRET_KEY: "change-me-please"
  POSTGRES_PASSWORD: "change-me-please"

# ── Django (ASGI / Channels) ────────────────────────────────────────────────
django:
  image:
    # 不変の semver タグ。argocd-image-updater が運用リポジトリへ書き戻す。
    repository: ghcr.io/d-party/backend
    tag: "v0.0.0"          # 初期値。image-updater が semver で書き換える
    pullPolicy: IfNotPresent
  # 2 以上にしてよい（close_active_sessions は古い行しか回収しない）。
  replicaCount: 1
  # django だけを強いノードへ寄せるとき用。未設定ならグローバルの値を使う。
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    port: 8000
  # グレースフル更新: 新 Pod が Ready になってから旧 Pod を落とす。
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  # 停止の猶予。preStop の待ち + gunicorn の graceful（処理中の HTTP の完了待ち）を見込む。
  # 既存の WebSocket は待たずに 1012 で閉じられる。
  terminationGracePeriodSeconds: 120
  # preStop: readiness を落としてから graceful させるためのスリープ秒。
  preStopSleepSeconds: 5
  # gunicorn の graceful-timeout / timeout を env で上書き（backend を改変しない）。
  gunicornGracefulTimeout: 110
  # 既定（cpu_count()+1）は多 CPU で OOM になりやすい。0 なら gunicorn.conf.py に従う。
  gunicornWorkers: 3
  # 数値でないと kubelet が runAsNonRoot を検証できない。
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 512Mi

# ── マイグレーション（Helm hook Job: post-install/post-upgrade）───────────────
# backend イメージ（django.image）で migrate を実行する。
migrate:
  enabled: true
  backoffLimit: 2

# ── Next.js フロントエンド ───────────────────────────────────────────────────
frontend:
  image:
    repository: ghcr.io/d-party/frontend
    tag: "v0.0.0"
    pullPolicy: IfNotPresent
  # RPi クラスタで他サービスと相乗りする前提のため既定 1。可用性が要るなら上げる。
  replicaCount: 1
  service:
    port: 3000
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  terminationGracePeriodSeconds: 30
  # frontend イメージの USER nextjs（uid 1001）。
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

# ── nginx（HTTP ルーティング専用。TLS は cloudflared が終端）────────────────
nginx:
  image:
    repository: nginx
    tag: "1.31"
    pullPolicy: IfNotPresent
  # RPi クラスタで他サービスと相乗りする前提のため既定 1。可用性が要るなら上げる。
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  # nginx -s quit による graceful 終了の猶予。
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 5
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# ── PostgreSQL（公式イメージ + 自前 StatefulSet。Bitnami chart は使わない）──
postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    database: d_party
    username: d_party
  service:
    port: 5432
  persistence:
    enabled: true
    # k3s 同梱 local-path-provisioner。別の StorageClass を使う場合は上書き。
    storageClass: "local-path"
    size: 5Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi

# ── Redis（Channels レイヤ / キャッシュ。公式イメージ + 自前 StatefulSet）────
redis:
  image:
    repository: redis
    tag: "8.10"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  persistence:
    enabled: false
    storageClass: "local-path"
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 192Mi

# ── Ingress（既定 OFF。ドメイン/複数ドメインは運用リポジトリ側で扱う）────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # 例:
  #   - host: chart-consumer-decides.example
  #     paths:
  #       - path: /
  #         pathType: Prefix
  tls: []

# ── NetworkPolicy（DB/Redis をこの release 内からのみ到達可能にする）──────────
# k3s 内蔵の NetworkPolicy controller が要る（`--disable-network-policy` なら別の CNI）。
networkPolicy:
  enabled: true

# ── PriorityClass（メモリ逼迫時に DB/Redis を優先して残す）────────────────────
# 共有の PriorityClass が既にあるなら create=false にして名前だけ指定する。
priorityClass:
  # true: 下記 2 つの PriorityClass を chart が生成して割り当てる。
  # false: 既存の PriorityClass 名を参照するだけ（name が空なら未指定）。
  create: true
  # postgres / redis 用（高め）。
  stateful:
    name: d-party-stateful
    value: 100000
  # django / frontend / nginx / migrate 用（低め）。
  app:
    name: d-party-app
    value: 10000

# 任意の nodeSelector / tolerations（RPi のラベルでスケジュール先を絞る場合）。
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []
