<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="60" />
    <title>メンテナンス中 | d-party</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0f1014;
        color: #fafafa;
        font-family:
          system-ui,
          -apple-system,
          "Hiragino Sans",
          "Noto Sans JP",
          "Yu Gothic UI",
          sans-serif;
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 480px;
        padding: 32px 28px;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 12px;
        background: #1a1b21;
        text-align: center;
      }
      .brand {
        margin: 0 0 20px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #fb2c36;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #a1a1a1;
      }
      p + p {
        margin-top: 12px;
      }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 8px 20px;
        border-radius: 8px;
        background: #fb2c36;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a:hover {
        background: #e0222c;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">d-party</p>
      <h1>メンテナンス中です</h1>
      <p>
        ただいまメンテナンス中か、一時的に接続できません。<br />
        しばらく時間をおいてから、もう一度お試しください。
      </p>
      <p>このページは 60 秒ごとに自動で再読み込みされます。</p>
      <a href="">再読み込み</a>
    </main>
  </body>
</html>
