# CodeQL。python（backend）と javascript-typescript（extension / frontend）を
# matrix でまとめて解析する。
name: Repo/CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "25 21 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            config-file: .github/codeql/python.yml
          - language: javascript-typescript
            config-file: .github/codeql/javascript.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 解析範囲は言語ごとの設定ファイルで絞る（.github/codeql/）。
          # 絞らないと javascript の解析が backend/web/static/ のベンダー製
          # minified ライブラリまで舐めに行く。
          config-file: ${{ matrix.config-file }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # category を明示する。指定しないと codeql-action は SARIF の
      # runAutomationDetails.id をワークフロー名から組み立てるため、名前に "/" が
      # 入っていると id が壊れて結果のアップロードに失敗する。
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
