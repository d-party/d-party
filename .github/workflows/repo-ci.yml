# パッケージを問わない lint（ワークフロー・シェル・YAML）と CodeQL。
name: Repo/CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # CodeQL の定期スキャン（毎週金曜 21:25 UTC）。
    - cron: "25 21 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # reviewdog の fail_level は既定 none（指摘があっても成功扱い）なので明示する。
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: any

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run ShellCheck
        # ブランチ（master）ではなくリリースタグを参照する。
        uses: ludeeus/action-shellcheck@2.0.0

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: yaml-lint
        uses: ibiqlik/action-yamllint@v3

  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            config-file: .github/codeql/python.yml
          - language: javascript-typescript
            config-file: .github/codeql/javascript.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 解析範囲は言語ごとの設定ファイルで絞る（.github/codeql/）。
          config-file: ${{ matrix.config-file }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # 省くとワークフロー名の "/" で id が壊れ、アップロードに失敗する。
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
