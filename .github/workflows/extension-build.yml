# 出荷する拡張機能を作り、中身を確かめる。
name: Extension/Build

on:
  push:
    branches:
      - main
    paths:
      - "extension/**"
      - "backend/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/extension-build.yml"
  pull_request:
    paths:
      - "extension/**"
      - "backend/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/extension-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build the production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # build:prod は turbo を通さないので Turborepo のキャッシュは復元しない。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter d-party-chrome-extension...

      - name: Build the production bundle
        run: pnpm --filter d-party-chrome-extension run build:prod

      # rspack が黙って空の出力を出すことがある。
      - name: Verify the bundle contents
        run: |
          set -euo pipefail
          cd extension/dist
          test -f manifest.json || { echo "manifest.json がない"; exit 1; }
          # shellcheck disable=SC2016
          # node に渡す JS。${...} はシェルで展開しない。
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const files = new Set();
            files.add(m.background.service_worker);
            for (const cs of m.content_scripts ?? []) {
              for (const f of [...(cs.js ?? []), ...(cs.css ?? [])]) files.add(f);
            }
            if (m.action?.default_popup) files.add(m.action.default_popup);
            let bad = 0;
            for (const f of files) {
              const ok = fs.existsSync(f) && fs.statSync(f).size > 0;
              console.log(`  ${ok ? "ok  " : "MISS"} ${f}`);
              if (!ok) bad++;
            }
            if (bad) { console.error(`${bad} 個の参照先が空か存在しない`); process.exit(1); }
            // 本番パッケージに開発用バックエンドの権限・match を残さない。
            if (/localhost/.test(JSON.stringify(m))) {
              console.error("manifest に localhost が残っている"); process.exit(1);
            }
            console.log(`manifest version: ${m.version}`);
          '

      # 肥大化に気づけるよう、サイズをログに残す。
      - name: Package as the store would
        run: |
          set -euo pipefail
          (cd extension/dist && zip -qr "${GITHUB_WORKSPACE}/extension.zip" .)
          ls -l extension.zip

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Restore the Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter d-party-chrome-extension...

      # 壊れた story が main に入って公開を落とさないように。
      - name: Build Storybook
        run: pnpm exec turbo run build-storybook --filter=d-party-chrome-extension
