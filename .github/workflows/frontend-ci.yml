# frontend の lint・型。成果物は Frontend/Build が見る。
name: Frontend/CI

on:
  push:
    branches:
      - main
    # Actions は YAML アンカーを解釈しないので、push と pull_request に同じリストを書く。
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Restore the Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter d-party-frontend...

      - name: Generate the API client
        run: pnpm exec turbo run api:generate --filter=d-party-frontend

      # 再生成して差分が出たら落とす。
      - name: Verify the generated API client is up to date
        run: git diff --exit-code -- frontend/src/infrastructure/api/generated

      # `<pkg>...` は依存する workspace パッケージ（@d-party/ui）も含める。
      - name: Type check
        run: pnpm exec turbo run typecheck --filter=d-party-frontend...

      - name: Lint
        run: pnpm exec turbo run lint --filter=d-party-frontend...

  license-check:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter d-party-frontend...

      # 許可リストは frontend/license-whitelist-node.txt。
      - name: Check licenses
        run: pnpm --filter d-party-frontend run license:check
