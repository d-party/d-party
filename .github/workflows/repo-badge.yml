# PR が触ったディレクトリに応じてラベル（Backend / Frontend / Extension / Infra）を付ける。
# 対応表は .github/labeler.yml。
name: Repo/Badge

on:
  # fork と Dependabot の PR では pull_request の GITHUB_TOKEN が読み取り専用になり、
  # ラベルを付けられない。pull_request_target は base 側の定義で走るので書き込める。
  # PR のコードは checkout も実行もしない（変更ファイルの一覧を API で読むだけ）。
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # ラベルがまだ無いとき、リポジトリに作るために要る。
      issues: write
    steps:
      - uses: actions/labeler@v7
        with:
          # 対象のパスを触らなくなったらラベルを外す。
          sync-labels: true
