# d-party 統一リリース。
#
# 全パッケージのバージョンを 1 つに揃え、タグと成果物をこのワークフローだけで作る。
#
# 流れ:
#   1. bump_type と最新タグ (vX.Y.Z) から次のバージョンを算出する。
#   2. 全パッケージの version を書き換えて main へ 1 コミット、タグを打つ。
#        backend/pyproject.toml (+ uv.lock) · extension/package.json ·
#        extension/public/manifest.json · frontend/package.json · package.json
#   3. そのタグから成果物を作る:
#        - backend / frontend: amd64 / arm64 をネイティブランナーで並列ビルドし、
#          manifest list にまとめて GHCR へ push
#          （Raspberry Pi の k3s へ argocd-image-updater が拾いに来る配信元）
#        - extension: build して zip を Release に添付し、Chrome Web Store へ upload
#
# 必要な設定:
#
#   ★ GHCR パッケージへの書き込み許可
#     ghcr.io/d-party/backend と ghcr.io/d-party/frontend には、このリポジトリの
#     Actions からの write が紐づいている必要がある。各パッケージの
#       Package settings → Manage Actions access → Add repository
#     で `d-party/d-party` に **Write** を付ける（1 回だけの手作業）。
#     これが無いと images ジョブが denied で落ちる。
#
#   ★ Chrome Web Store 用の secrets
#     EXTENSION_ID / CLIENT_ID / CLIENT_SECRET / REFRESH_TOKEN
name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_note:
        description: "Release notes (optional)"
        required: false
        type: string
      publish:
        description: "Publish the extension to the Chrome Web Store (false = upload only)"
        required: false
        type: boolean
        default: false

# リリースは重ねて走らせない。走行中のものは止めない。
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # ── 1. バージョンを決めて、全パッケージへ反映し、タグを打つ ────────────────
  version:
    name: Bump versions and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      num: ${{ steps.version.outputs.num }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend
          cache-dependency-glob: "backend/uv.lock"

      - name: Determine next version
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail
          # バージョンの真実はこのリポジトリのタグ 1 本。
          LATEST=$(git tag --list 'v*.*.*' | sort -V | tail -n1)
          if [ -z "${LATEST}" ]; then
            VER="2.3.0"
          else
            BASE=${LATEST#v}
            IFS=. read -r MAJOR MINOR PATCH <<< "${BASE}"
            case "${BUMP_TYPE}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
              minor) MINOR=$((MINOR+1)); PATCH=0;;
              patch) PATCH=$((PATCH+1));;
            esac
            VER="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "num=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${VER} (from ${LATEST:-<none>})"

      - name: Apply the version to every package
        env:
          VERSION: ${{ steps.version.outputs.num }}
        run: |
          set -euo pipefail

          # version 行だけを差し替え、フォーマット差分を出さない。
          # 対象は backend の pyproject.toml と、JSON 側 4 つ。
          python3 - <<'EOF'
          import os, re

          v = os.environ["VERSION"]

          toml_path = "backend/pyproject.toml"
          s = open(toml_path, encoding="utf-8").read()
          s, n = re.subn(r'(?m)^version\s*=\s*".*"$', f'version = "{v}"', s, count=1)
          assert n == 1, f"version line not found in {toml_path}"
          open(toml_path, "w", encoding="utf-8").write(s)

          for path in (
              "extension/package.json",
              "extension/public/manifest.json",
              "frontend/package.json",
              "package.json",
          ):
              s = open(path, encoding="utf-8").read()
              s, n = re.subn(r'("version"\s*:\s*")[^"]*(")', rf'\g<1>{v}\g<2>', s, count=1)
              assert n == 1, f"version field not found in {path}"
              open(path, "w", encoding="utf-8").write(s)

          print(f"applied v{v} to 5 files")
          EOF

          # uv.lock もプロジェクトの version を持つので、pyproject と乖離しないよう
          # 引き直す（依存は変えないので version 行だけが動く）。
          (cd backend && uv lock)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/pyproject.toml backend/uv.lock \
                  extension/package.json extension/public/manifest.json \
                  frontend/package.json package.json
          if git diff --cached --quiet; then
            echo "already at v${VERSION}; skipping the bump commit"
          else
            git commit -m "chore: release v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Force-update the release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -f "${TAG}"
          git push origin "refs/tags/${TAG}" --force

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ inputs.release_note }}
          generate_release_notes: true
          target_commitish: main

  # ── 2. サーバ側のイメージを arm64 ネイティブでビルドして GHCR へ ──────────
  #
  # Raspberry Pi (arm64) の k3s が pull する配信元。QEMU を使わないよう
  # arm64 ランナーで焼く。タグは git タグと完全一致させる（`v` 付き・不変）ので、
  # argocd-image-updater が semver で拾って ops リポジトリの values を書き換える。
  # ── 2. サーバ側のイメージをビルドして GHCR へ ────────────────────────────
  #
  # Raspberry Pi (arm64) の k3s が pull する配信元。amd64 も一緒に出しておくと、
  # x86 のホストやローカルでも同じタグをそのまま使える。
  #
  # **アーキテクチャごとにネイティブランナーで並列ビルドする。** 片方のランナーで
  # QEMU エミュレーションすると、backend の uv sync と frontend の next build が
  # 数倍に伸びるため。各ジョブは**タグを付けずダイジェストだけを push**し、
  # 後段の manifest ジョブがそれらを 1 つの manifest list にまとめる
  # （docker/build-push-action の push-by-digest。マルチランナー分散の定石）。
  images:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # image × platform の直積で 4 ジョブ。include は「元のマトリクスに無いキーだけ」
      # だと全組み合わせへ適用されて最後の 1 つに潰れるので、platform を元の
      # マトリクスのキーにして、include はそれに紐づく値（arch 名とランナー）の
      # 付与に徹させる。
      matrix:
        image: [backend, frontend]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # backend は自分のディレクトリがコンテキスト。frontend はリポジトリのルート
      # （pnpm workspace のロックファイルがルートにあるため。frontend/Dockerfile 参照）。
      # NEXT_PUBLIC_* は渡さない — prod-kube はブラウザの origin から接続先を導出する。
      # compose-prod は引き続き build.args で焼くのでこのジョブの影響を受けない。
      # backend も設定をすべて runtime env で読むため build-args は不要。
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image == 'backend' && 'backend' || '.' }}
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform }}
          # OCI の標準ラベル。`org.opencontainers.image.source` は GHCR が
          # 「どのリポジトリのパッケージか」を判断するのに使う。
          # これらのパッケージは旧 d-party/backend · d-party/frontend から
          # 作られたため、いまもそちらにリンクされている（どちらも archive 済み）。
          # ラベルでこのリポジトリを指しておく。
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=d-party ${{ matrix.image }}
          outputs: >-
            type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      # ダイジェストをファイル名だけの空ファイルとして artifact に載せ、
      # manifest ジョブが集めて 1 本にまとめる。
      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 各アーキテクチャのダイジェストを 1 つの manifest list にまとめ、リリースタグを打つ。
  # k3s / docker はこのタグを pull すると自分のアーキテクチャの層だけを取る。
  manifest:
    name: Publish the ${{ matrix.image }} manifest
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # タグは git タグと完全一致させる（`v` 付き・不変）ので、
      # argocd-image-updater が semver で拾って ops リポジトリの values を書き換える。
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # ラベルは各アーキのイメージ config に載るが、pull 側がまず見るのは
          # index なので、index にも同じ annotation を付けておく。
          # shellcheck disable=SC2046
          # 各ダイジェストを引数へ展開したいので、ここは意図的にクォートしない。
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            --annotation "index:org.opencontainers.image.source=${SOURCE}" \
            --annotation "index:org.opencontainers.image.url=${SOURCE}" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${TAG}" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect the published image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          TAG: ${{ needs.version.outputs.tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${TAG}"

  # ── 3. 拡張機能をビルドして Release に添付し、Chrome Web Store へ ─────────
  extension:
    name: Build & publish the extension
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter d-party-chrome-extension...

      - name: Generate the API client
        run: pnpm --filter d-party-chrome-extension run api:generate

      - name: Build the extension
        run: pnpm --filter d-party-chrome-extension run build:prod

      - name: Package the extension
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          (cd extension/dist && zip -r "${GITHUB_WORKSPACE}/d-party_${TAG}.zip" .)

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "${TAG}" "d-party_${TAG}.zip" --clobber

      # Chrome Web Store API を curl で直接叩く。
      # 以前は mnao305/chrome-extension-upload を使っていたが、API のレスポンスボディを
      # 一切ログに出さない仕様のため 400 等の障害切り分けが不可能だった
      # （`itemError[].error_code` / `uploadState` / `statusDetail` が見えない）。
      # ここでは OAuth2 token exchange → upload(PUT) → publish(POST) を順に実行し、
      # 各レスポンスを JSON のまま GitHub Actions ログへ出力する。
      # 参考: https://developer.chrome.com/docs/webstore/using-api
      - name: Upload to the Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
          ZIP: d-party_${{ needs.version.outputs.tag }}.zip
        run: |
          set -euo pipefail

          # 1) refresh token -> access token
          echo "::group::Exchange refresh_token for access_token"
          token_resp=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${REFRESH_TOKEN}" \
            --data-urlencode "grant_type=refresh_token")
          # access_token / id_token はログに出さない
          echo "${token_resp}" | jq 'del(.access_token, .id_token)'
          echo "::endgroup::"
          access_token=$(echo "${token_resp}" | jq -r '.access_token // empty')
          if [ -z "${access_token}" ]; then
            echo "::error::failed to obtain access_token (see token response above)"
            exit 1
          fi

          # 2) Upload zip (PUT). 既存ドラフトを上書きする。
          echo "::group::Upload ${ZIP} to item ${EXTENSION_ID}"
          upload_resp=$(curl -sS -X PUT \
            -H "Authorization: Bearer ${access_token}" \
            -H "x-goog-api-version: 2" \
            -T "${ZIP}" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${EXTENSION_ID}")
          echo "${upload_resp}" | jq .
          echo "::endgroup::"
          upload_state=$(echo "${upload_resp}" | jq -r '.uploadState // empty')
          if [ "${upload_state}" != "SUCCESS" ]; then
            echo "::error::CWS upload failed (uploadState=${upload_state:-<none>})"
            exit 1
          fi

          # 3) Publish (任意)。既定はアップロードのみ。
          if [ "${PUBLISH}" = "true" ]; then
            echo "::group::Publish item ${EXTENSION_ID}"
            publish_resp=$(curl -sS -X POST \
              -H "Authorization: Bearer ${access_token}" \
              -H "x-goog-api-version: 2" \
              -H "Content-Length: 0" \
              "https://www.googleapis.com/chromewebstore/v1.1/items/${EXTENSION_ID}/publish")
            echo "${publish_resp}" | jq .
            echo "::endgroup::"
            status=$(echo "${publish_resp}" | jq -r '.status[0] // empty')
            case "${status}" in
              OK|ITEM_PENDING_REVIEW) ;;
              *)
                echo "::error::CWS publish failed (status=${status:-<none>})"
                exit 1
                ;;
            esac
          else
            echo "publish=false: アップロードのみ完了。公開は Developer Dashboard から手動で行ってください。"
          fi
