# Storybook を GitHub Pages へ公開する。
#
# **GitHub Pages は 1 リポジトリにつき 1 サイト**なので、パッケージごとに
# デプロイを分けると後から走った方が先の Storybook を上書きしてしまう。
# 両方をビルドし、1 回の Pages デプロイにサブパスとしてまとめる:
#
#   https://<org>.github.io/<repo>/extension/   ← 拡張機能の Storybook
#   https://<org>.github.io/<repo>/frontend/    ← フロントエンドの Storybook
#   https://<org>.github.io/<repo>/             ← 両者への索引
#
# 必要な設定:
#
#   ★ GitHub Pages を有効にし、ソースを「GitHub Actions」にする
#     Settings → Pages → Build and deployment → Source: GitHub Actions
#     （API なら `gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow`）
#     未設定だと build は成功するのに deploy だけが
#       Error: Failed to create deployment (status: 404) ...
#       Ensure GitHub Pages has been enabled
#     で落ちる。リポジトリ単位の設定なので、fork や新しいリポジトリでは
#     このワークフローを入れただけでは動かない。
name: Storybook/Deploy

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/storybook-deploy.yml"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Turborepo のローカルキャッシュ（.turbo/cache）を実行間で持ち越す。
      # キーの主軸は **pnpm-lock.yaml のハッシュ**: ロックファイルが変われば
      # 依存が変わりタスクのハッシュも総入れ替えになるので、キャッシュも分ける。
      # 同じロックファイルのあいだは restore-keys で直前の実行結果を引き継ぎ、
      # 変更のないパッケージのタスクは丸ごとスキップされる。
      - name: Restore the Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo が両パッケージの build-storybook を回す。出力はそれぞれ
      # extension/storybook-static と frontend/storybook-static。
      - name: Build both Storybooks
        run: pnpm run build-storybook

      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r extension/storybook-static site/extension
          cp -r frontend/storybook-static  site/frontend
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>d-party Storybook</title>
              <style>
                body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 32rem; padding: 0 1rem; }
                li { margin: .5rem 0; }
              </style>
            </head>
            <body>
              <h1>d-party Storybook</h1>
              <ul>
                <li><a href="./extension/">extension</a> — Chrome/Edge 拡張機能</li>
                <li><a href="./frontend/">frontend</a> — ユーザー向けフロントエンド</li>
              </ul>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
