# Pages は 1 リポジトリ 1 サイトなので、両 Storybook を 1 回のデプロイで
# /extension/ と /frontend/ に置く。Pages のソースを GitHub Actions にしておくこと。
name: Storybook/Deploy

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "frontend/**"
      # 両 Storybook は packages/ui の story も取り込む。
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/storybook-deploy.yml"
  workflow_dispatch:

# 既定は読み取りのみ。Pages への書き込みは deploy ジョブにだけ与える
# （build ジョブは pnpm install でサードパーティのコードを実行するため）。
permissions:
  contents: read

# Only one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Restore the Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # turbo が両パッケージの build-storybook を回す。出力はそれぞれ
      # extension/storybook-static と frontend/storybook-static。
      - name: Build both Storybooks
        run: pnpm run build-storybook

      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r extension/storybook-static site/extension
          cp -r frontend/storybook-static  site/frontend
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ja">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>d-party Storybook</title>
              <style>
                body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 32rem; padding: 0 1rem; }
                li { margin: .5rem 0; }
              </style>
            </head>
            <body>
              <h1>d-party Storybook</h1>
              <ul>
                <li><a href="./extension/">extension</a> — Chrome/Edge 拡張機能</li>
                <li><a href="./frontend/">frontend</a> — ユーザー向けフロントエンド</li>
              </ul>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
