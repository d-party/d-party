# 配信する frontend を作って動かす。
name: Frontend/Build

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build the Next bundle & Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Restore the Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}-

      # .next/cache は turbo の outputs に入れていないので別に持ち越す。
      - name: Restore the Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter d-party-frontend...

      - name: Build
        run: pnpm exec turbo run build --filter=d-party-frontend

      # server.js が無いと、イメージは組めても起動で落ちる。
      - name: Verify the standalone output
        run: |
          set -euo pipefail
          test -f frontend/.next/standalone/frontend/server.js \
            || { echo "standalone の server.js がない"; exit 1; }
          test -d frontend/.next/static \
            || { echo ".next/static がない"; exit 1; }
          echo "standalone ok"

      # 壊れた story が main に入って公開を落とさないように。
      - name: Build Storybook
        run: pnpm exec turbo run build-storybook --filter=d-party-frontend

  image:
    name: Build & smoke-test the runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Dockerfile は dev でも上の bundle ジョブでも使わないので、ここでしか壊れに気づけない。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the runtime image
        run: docker build -f frontend/Dockerfile -t d-party-frontend:ci .

      - name: Start the container
        run: docker run -d --name frontend-ci -p 3000:3000 d-party-frontend:ci

      - name: Wait for the server
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/ 2>/dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready in time"
          exit 1

      - name: Check the pages render
        run: |
          for path in / /usage /qa /privacy /stats; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/__does_not_exist__)
          echo "/__does_not_exist__ -> $code"
          [ "$code" = "404" ] || exit 1

      - name: Container logs
        if: always()
        run: docker logs frontend-ci

      - name: Stop the container
        if: always()
        run: docker rm -f frontend-ci
