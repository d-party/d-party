# backend の lint・型・テスト。イメージは Backend/Build が見る。
name: Backend/CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    working-directory: backend

jobs:
  ruff:
    name: Ruff (format & lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install dependencies
        run: uv sync --frozen
      # 検査だけ。自動で直してコミットはしない。
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .

  pytest:
    name: Pytest (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # カバレッジのコメントとデータブランチへの書き込み。
      contents: write
      pull-requests: write
    # Redis は不要（conftest.py がインメモリに差し替える）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: d_party
          POSTGRES_USER: d_party
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U d_party -d d_party"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: django-insecure-ci
      DEBUG: "1"
      MY_DOMAIN: localhost
      D_ANIME_STORE_DOMAIN: animestore.docomo.ne.jp
      TIME_ZONE: Asia/Tokyo
      LANGUAGE_CODE: ja
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_USER: d_party
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      POSTGRES_DB: d_party
      POSTGRES_PASSWORD: password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CHROME_EXTENSION_REQUIRED_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install dependencies
        run: uv sync --frozen
      - name: check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: migrate
        run: uv run python manage.py migrate
      - name: run pytest
        run: uv run pytest --cov --cov-report=xml
      # fork の PR では投稿できないので continue-on-error（本文は artifact に残る）。
      - name: Coverage comment
        id: coverage_comment
        continue-on-error: true
        uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          # .coverage はリポジトリのルートではなく backend/ に出る。
          COVERAGE_PATH: backend
          MINIMUM_GREEN: "85"
          MINIMUM_ORANGE: "70"
      - name: Store coverage comment body
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-comment-action
          path: backend/python-coverage-comment-action.txt

  mypy:
    name: mypy (type check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # settings の import が env を要求する。接続はしないので値はダミーでよい。
    env:
      SECRET_KEY: django-insecure-ci
      DEBUG: "1"
      MY_DOMAIN: localhost
      D_ANIME_STORE_DOMAIN: animestore.docomo.ne.jp
      TIME_ZONE: Asia/Tokyo
      LANGUAGE_CODE: ja
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_USER: d_party
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      POSTGRES_DB: d_party
      POSTGRES_PASSWORD: password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CHROME_EXTENSION_REQUIRED_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install dependencies
        run: uv sync --frozen
      - name: run mypy
        run: uv run mypy .

  # backend/openapi.json は frontend と拡張機能の orval が読む。view を変えたのに
  # 再生成を忘れると TypeScript の型が古いままになるので、ここで落とす。
  openapi:
    name: OpenAPI schema is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # settings の import が env を要求する。接続はしないので値はダミーでよい。
    env:
      SECRET_KEY: django-insecure-ci
      DEBUG: "1"
      MY_DOMAIN: localhost
      D_ANIME_STORE_DOMAIN: animestore.docomo.ne.jp
      TIME_ZONE: Asia/Tokyo
      LANGUAGE_CODE: ja
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_USER: d_party
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      POSTGRES_DB: d_party
      POSTGRES_PASSWORD: password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CHROME_EXTENSION_REQUIRED_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install dependencies
        run: uv sync --frozen
      - name: generate the schema
        run: uv run python manage.py spectacular --format openapi-json --file openapi.json --validate --fail-on-warn
      # 差分が出たら、上のコマンドと `pnpm run api:generate` をローカルで走らせてコミットする。
      - name: verify the committed schema is up to date
        run: git diff --exit-code -- openapi.json

  license-check:
    name: License check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: install dependencies
        run: uv sync --frozen
      - name: check licenses
        # --partial-match: SPDX expressions like "Apache-2.0 OR BSD-3-Clause" fail exact matching.
        run: >
          uv run pip-licenses
          --with-system
          --partial-match
          --allow-only="$(grep -v '^[[:space:]]*#' license-whitelist-python.txt | grep -v '^[[:space:]]*$' | paste -sd ';')"
