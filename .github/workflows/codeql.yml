# CodeQL。
#
# モノレポ化前は backend が python を（ci.yml の codeql ジョブ）、
# chrome-extension が javascript を（codeql-analysis.yml）それぞれ解析していた。
# 1 リポジトリになったので、言語を matrix にまとめて 1 本で回す。
name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "25 21 * * 5"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            config-file: .github/codeql/python.yml
          - language: javascript-typescript
            config-file: .github/codeql/javascript.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # 解析範囲は言語ごとの設定ファイルで絞る（.github/codeql/）。
          # 絞らないと javascript の解析が backend/web/static/ のベンダー製
          # minified ライブラリまで舐めに行く。
          config-file: ${{ matrix.config-file }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
