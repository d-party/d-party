# extension（Chrome/Edge 拡張）と frontend（Next.js）の CI。
#
# モノレポ化前は d-party/chrome-extension と d-party/frontend が
# ほぼ同一の ci.yml / license-check.yml をそれぞれ持っていた。pnpm workspace に
# 統合したので、ここ 1 本で両パッケージを回す。個々のパッケージを列挙せず
# `turbo run` に任せているため、パッケージが増えてもこのファイルは変わらない。
name: CI (node)

on:
  push:
    branches:
      - main
    # GitHub Actions は YAML のアンカー/エイリアスを解釈しないので、
    # push と pull_request で同じリストを書き下している。
    paths:
      - "extension/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-node.yml"
  pull_request:
    paths:
      - "extension/**"
      - "frontend/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/ci-node.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API clients
        run: pnpm run api:generate

      # 生成物はコミットしているので、古い checkout では openapi/openapi.json と
      # 静かにずれる。上で再生成し、作業ツリーが変わったら落とす。
      - name: Verify the generated API clients are up to date
        run: |
          git diff --exit-code -- \
            extension/src/infrastructure/api/generated \
            frontend/src/infrastructure/api/generated

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # storybook.yml は main でしかビルドしない（Pages へ公開するため）。
      # ここでも建てて、壊れた story が main に入って公開を落とすのを防ぐ。
      - name: Build Storybook
        run: pnpm run build-storybook

  license-check:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 許可リストは各パッケージの license-whitelist-node.txt（SPDX を 1 行 1 個）。
      # production 依存に載っていないライセンスがあれば落とし、GPL/AGPL/SSPL の
      # 混入を防ぐ。拡張の仕方はそのファイルを参照。
      - name: Check licenses
        run: pnpm run license:check

  docker:
    name: Build & smoke-test the frontend runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 本番配信は frontend/Dockerfile（Next standalone）だが、上の build ジョブは
    # pnpm を直接叩くだけでイメージを作らない。dev の compose も Dockerfile を
    # 使わない（node イメージで pnpm dev を回す）ため、Dockerfile 側だけが壊れても
    # どこにも引っかからない。実際に corepack 同梱の廃止と
    # pnpm-workspace.yaml のコピー漏れの 2 件がこのすき間を通り抜けた。
    #
    # モノレポ化でここはさらに壊れやすくなった: ビルドコンテキストがルートになり、
    # Next の outputFileTracingRoot がワークスペースのルートへ動くため
    # standalone の中身の形が変わる（standalone/frontend/server.js）。
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the runtime image
        run: docker build -f frontend/Dockerfile -t d-party-frontend:ci .

      - name: Start the container
        run: docker run -d --name frontend-ci -p 3000:3000 d-party-frontend:ci

      # standalone サーバの起動を待つ。60 秒待っても応答しなければ失敗させる。
      - name: Wait for the server
        run: |
          for _ in $(seq 1 30); do
            # 起動待ちの間の接続エラーはノイズなので捨てる。上がらなかった
            # ときの診断は下の Container logs ステップで足りる。
            if curl -fsS -o /dev/null http://localhost:3000/ 2>/dev/null; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become ready in time"
          exit 1

      # ビルドが通ってもページが 500 になる壊れ方があるので、実際に引いて確認する。
      - name: Check the pages render
        run: |
          for path in / /usage /qa /privacy; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
          # not-found ルートが 404 を返すこと（500 との取り違えを拾う）。
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/__does_not_exist__)
          echo "/__does_not_exist__ -> $code"
          [ "$code" = "404" ] || exit 1

      - name: Container logs
        if: always()
        run: docker logs frontend-ci

      - name: Stop the container
        if: always()
        run: docker rm -f frontend-ci
