# Helm chart の静的検証（クラスタ不要）。
name: Infra/CI

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  helm:
    name: Helm chart (lint & template)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
      - name: helm lint
        run: helm lint infra/helm/d-party
      - name: helm template (defaults)
        run: helm template d-party infra/helm/d-party > /dev/null
      # 本番に近い上書き（外部 Secret + 独自ドメイン）でも組めること。
      - name: helm template (existingSecret + domain)
        run: |
          helm template d-party infra/helm/d-party \
            --set config.MY_DOMAIN=d-party.example \
            --set secret.existingSecret=d-party-secret > /dev/null
