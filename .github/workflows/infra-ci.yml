# infra/（k3s / Helm）の CI。
#
# chart が壊れると Raspberry Pi へのリリースがそのまま止まるため、クラスタ無しで
# できる静的検証（helm lint / helm template）をここで回す。
name: Infra/CI

on:
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  helm:
    name: Helm chart (lint & template)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
      # 秘密値は既定を持たないので、lint / template には外部 Secret 名か平文を渡す。
      - name: helm lint
        run: helm lint infra/helm/d-party --set secret.existingSecret=d-party-secret
      - name: helm template (chart-generated secret)
        run: |
          helm template d-party infra/helm/d-party \
            --set secret.SECRET_KEY=ci --set secret.POSTGRES_PASSWORD=ci > /dev/null
      - name: helm template (no secret is rejected)
        run: |
          if helm template d-party infra/helm/d-party > /dev/null 2>&1; then
            echo "秘密値なしで render できてしまう"; exit 1
          fi
      - name: helm template (existingSecret + domain)
        run: |
          helm template d-party infra/helm/d-party \
            --set config.MY_DOMAIN=d-party.example \
            --set secret.existingSecret=d-party-secret > /dev/null
