# 週次保守。Dependabot PR を Claude Code が調べて判定し（review）、判定を機械的な条件で
# 確かめてからマージし（merge）、規則どおりにリリースを切る（release）。
# 無人実行のルールは各 SKILL.md の「非対話モード」節。
#
# 権限の分け方:
#   - review は未マージの依存のコードを install / build / test で動かし、PR 本文や上流の
#     changelog のような第三者が書いたテキストも読む。だから書き込み権限を持たせない
#     （GitHub が Dependabot の PR の CI に読み取り専用のトークンを渡すのと同じ前提）。
#   - merge は書き込み権限を持つが、依存のコードも LLM も動かさない。
#     review の判定は候補としてだけ使い、条件は .github/scripts/dependabot-merge.sh が確かめる。
#   - release も LLM を使わない（.github/scripts/weekly-release.sh）。
#
# GITHUB_TOKEN の制約:
#   - GITHUB_TOKEN による push / マージは後続のワークフローを起動しない。
#     マージ後の main で走る push トリガのワークフロー（storybook-deploy など）も起動しない。
#   - GITHUB_TOKEN には `workflows` 権限が無いため、.github/workflows/ を書き換える
#     PR（github-actions ecosystem）はマージできない。検証結果をコメントして人に回す。
#   - workflow_dispatch は GITHUB_TOKEN からでも起動できるので、release.yml は動く。
name: Repo / Maintenance

on:
  schedule:
    # 毎週火曜 10:00 JST（01:00 UTC）。Dependabot は月曜 12:00 JST に PR を立てるので、
    # その CI が一巡した後に拾う。
    - cron: "0 1 * * 2"
  workflow_dispatch:
    inputs:
      release:
        description: "Run the weekly release after the Dependabot review"
        required: false
        type: boolean
        default: true

# 保守は重ねて走らせない。走行中のものは止めない（マージ途中で切らない）。
concurrency:
  group: maintenance
  cancel-in-progress: false

permissions: {}

jobs:
  review:
    name: Review Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 読み取りだけ。マージ・コメント・push はこのジョブからはできない。
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
    # 依存のコードがキャッシュを書き換えると、main のキャッシュを復元する release.yml の
    # ビルドまで届く（スケジュール実行は main のキャッシュに書ける）。読むだけにする。
    cache-mode: read
    # backend の pytest 用。
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_DB: d_party
          POSTGRES_USER: d_party
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U d_party -d d_party"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 読み取り専用（上の permissions）。gh pr view / gh run view 用。
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SECRET_KEY: django-insecure-ci
      DEBUG: "1"
      MY_DOMAIN: localhost
      D_ANIME_STORE_DOMAIN: animestore.docomo.ne.jp
      TIME_ZONE: Asia/Tokyo
      LANGUAGE_CODE: ja
      DATABASE_ENGINE: django.db.backends.postgresql
      DATABASE_USER: d_party
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      POSTGRES_DB: d_party
      POSTGRES_PASSWORD: password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CHROME_EXTENSION_REQUIRED_VERSION: 1.0.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # このジョブのトークンは読み取り専用で、隠してはいない（job の env に GH_TOKEN があり、
          # claude-code-action も .git/config に書く）。push しないので保存しない。
          persist-credentials: false

      # ゲートのツールは先に入れておく（Claude に入れさせない）。
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          working-directory: backend
          cache-dependency-glob: "uv.lock"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # 検証用に PR を束ねるローカルの merge commit に要る。push はしない。
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Skill ツールで `dependabot-review-and-merge` を実行してください。
            これは GitHub Actions 上の無人実行です。ユーザーへの質問はできません。
            SKILL.md の「非対話モード（GitHub Actions の定期実行）」節のルールを
            他のすべての手順より優先して守ってください。
            判定は、その節の形でリポジトリのルートの `maintenance-verdict.json` に書いてください。
          # ゲートの build / storybook / pytest は数分かかるので Bash の上限を延ばす。
          settings: |
            {
              "env": {
                "BASH_DEFAULT_TIMEOUT_MS": "1200000",
                "BASH_MAX_TIMEOUT_MS": "1800000"
              }
            }
          claude_args: |
            --allowedTools "Skill,Bash,Read,Edit,Write,Glob,Grep,WebFetch,TodoWrite"

      - name: Upload the verdict
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-verdict
          path: maintenance-verdict.json
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge approved Dependabot PRs
    needs: review
    runs-on: ubuntu-latest
    # Dependabot の rebase を最大 30 分待つ。
    timeout-minutes: 60
    # 依存のコードと LLM を動かさないジョブにだけ書き込み権限を渡す。
    permissions:
      contents: write
      pull-requests: write
      # head commit のチェック結果（statusCheckRollup）を読む。
      checks: read
      statuses: read
    cache-mode: none
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@v8
        with:
          name: dependabot-verdict
          path: ${{ runner.temp }}/verdict

      - name: Merge and comment
        run: .github/scripts/dependabot-merge.sh "$RUNNER_TEMP/verdict/maintenance-verdict.json"

  release:
    name: Cut the weekly release
    needs: [review, merge]
    # review や merge が失敗しても main にあるもの（マージ済みの分）はリリースしてよい。
    # 手動実行で release=false のときだけ止める。
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.release) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
      # 保留の issue を立てる。
      issues: write
      # release.yml の dispatch。
      actions: write
      checks: read
    cache-mode: none
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide and dispatch the release
        run: .github/scripts/weekly-release.sh
