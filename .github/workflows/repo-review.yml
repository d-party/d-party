# reviewdog で PR にインラインコメントを付けるためのワークフロー。
# 検査そのもの（mypy / actionlint）は backend-ci.yml と repo-ci.yml が回しており、
# ここは「PR の差分にコメントを載せる」ことだけが目的。
name: Repo/Review

on:
  pull_request:

permissions: {}

jobs:
  mypy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    # 型検査そのものは ci-backend.yml が回している。django-stubs プラグインが
    # DJANGO_SETTINGS_MODULE を import するため、同じダミー env が要る
    # （DB/Redis へ実接続はしないのでサービスコンテナは不要）。
    env:
      SECRET_KEY: django-insecure-ci
      DEBUG: "1"
      MY_DOMAIN: localhost
      D_ANIME_STORE_DOMAIN: animestore.docomo.ne.jp
      TIME_ZONE: Asia/Tokyo
      LANGUAGE_CODE: ja
      DATABASE_ENGINE: django_prometheus.db.backends.postgresql
      DATABASE_USER: d_party
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      POSTGRES_DB: d_party
      POSTGRES_PASSWORD: password
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      CHROME_EXTENSION_REQUIRED_VERSION: 1.0.0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      # action-mypy は v4 以降 setup_method の既定が "nothing" になり、自前では
      # mypy を入れなくなった（v3 は入れていた）。requirements.txt を吐くだけでは
      # mypy が PATH に無く exit 127 になるため、プロジェクトの venv を作って
      # そこへ通す。pip install mypy ではなく uv sync にすることで、django-stubs /
      # drf-stubs プラグインが解決できる ci-backend.yml と同じ環境になる。
      - name: install dependencies
        run: uv sync --frozen
      - name: put the project venv on PATH
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: tsuyoshicho/action-mypy@v5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: "github-pr-review"
          # python のコードは backend/ にしかない。
          workdir: "backend"
          target: "."

  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          reporter: "github-pr-review"

  textlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup node/npm
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      # --no-save: ルートには workspace の package.json があるので、ここで
      # --save-dev すると依存が書き込まれ、reviewdog がその差分まで指摘してしまう。
      # ルールは .textlintrc.json（ルート）から読む。
      - run: |
          npm install --no-save textlint textlint-rule-write-good
      - name: textlint-github-pr-review
        uses: tsuyoshicho/action-textlint@v3
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          textlint_flags: "README.md"
