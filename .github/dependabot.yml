version: 2

# directory でパッケージを指し分ける。
updates:
  # ── backend（Django / uv）───────────────────────────────────────────────
  # pip エコシステムでは uv.lock を更新できない。
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # まとめるのは定期更新だけ。セキュリティ更新は 1 件ずつ見る。
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── extension + frontend（pnpm workspace）──────────────────────────────
  # ロックファイルはルートに 1 本。どの package.json を書き換えるかは Dependabot が決める。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── Dockerfile のベースイメージ ─────────────────────────────────────────
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    commit-message:
      prefix: "chore(deps)"

  # ── docker compose のイメージ（nginx / postgres / redis / certbot / k6）─────
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
