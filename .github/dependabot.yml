version: 2

# directory でパッケージを指し分ける。
updates:
  # ── backend（Django / uv）───────────────────────────────────────────────
  # Python 依存は uv（pyproject.toml + uv.lock）で管理している。
  # pip エコシステムでは uv.lock を更新できないため "uv" を使う。
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # 定期のバージョン更新だけまとめる。セキュリティ更新は
      # 個別 PR のまま（applies-to: version-updates）にして、
      # 1 件ずつ影響を確認できるようにする。
      python-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── extension + frontend（pnpm workspace）──────────────────────────────
  # ロックファイルはルートに 1 本しかないため、npm エコシステムの対象も "/" の
  # 1 つだけ。Dependabot は pnpm workspace を解釈し、どのパッケージの
  # package.json を書き換えるかを自分で判断する。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── Dockerfile のベースイメージ ─────────────────────────────────────────
  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/frontend"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    commit-message:
      prefix: "chore(deps)"

  # ── GitHub Actions ─────────────────────────────────────────────────────
  # ワークフローはルートの .github/workflows/ に一本化したので対象も "/" だけ。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
      time: "12:00"
    target-branch: main
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
