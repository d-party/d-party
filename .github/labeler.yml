# Repo / Badge（repo-badge.yml）の設定。PR が触ったパスから、対象のラベルを付ける。
# パスは各 CI の paths フィルタに合わせる（packages/ は frontend と extension の両方が使う）。
Backend:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/**"

Frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"
          - "packages/**"

Extension:
  - changed-files:
      - any-glob-to-any-file:
          - "extension/**"
          - "packages/**"

Infra:
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"
