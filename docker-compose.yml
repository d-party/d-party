x-env_file: &env_file ./.env.global

services:
  nginx:
    container_name: nginx
    image: nginx:1.27
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./nginx/:/etc/nginx/"
      - "./backend/static:/static"
      - "./nginx/.well-known:/.well-known"
    depends_on:
      django:
        condition: service_healthy
      frontend:
        condition: service_healthy
    env_file: *env_file
  django:
    container_name: django
    # Pin the built image name so it does not depend on the compose project
    # (checkout-directory) name; dockle/trivy in CI scan `backend-django`.
    image: backend-django
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8000:8000
    volumes:
      - ./backend/:/usr/src/app/
      - ./backend/.env.django:/env_files/.env.django
      - ./.env.global:/env_files/.env.global
    command: "sh entrypoint.sh"
    env_file:
      - ./backend/.env.django
      - *env_file
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import socket,sys; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  frontend:
    # frontend の実体は環境ごとにオーバーレイで与える:
    #   dev  (docker-compose.override.yml): node イメージで `pnpm dev`（HMR）
    #   prod (docker-compose.prod.yml)    : Dockerfile で standalone ビルドを配信
    container_name: frontend
    expose:
      - "3000"
    env_file: *env_file
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      - "./postgres/data:/var/lib/postgresql/data"
    env_file:
      - ./postgres/.env.postgres
      - *env_file
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4
    container_name: redis
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
