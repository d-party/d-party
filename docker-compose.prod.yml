# 本番用。frontend は standalone、nginx が TLS を終端し、certbot が証明書を更新する。
#   ./init-letsencrypt.sh --staging        # 初回。確認後に --production
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile letsencrypt up -d

services:
  django:
    env_file:
      - ./.env.prod
    restart: unless-stopped

  frontend:
    # NEXT_PUBLIC_* は build で埋め込む。build 引数は env_file を読めないので .env.prod と揃える。
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_PROTOCOL: "https://"
        NEXT_PUBLIC_BACKEND_HOST: "d-party.net/"
        NEXT_PUBLIC_WEBSOCKET_PROTOCOL: "wss://"
    env_file:
      - ./.env.prod
    restart: unless-stopped

  nginx:
    env_file:
      - ./.env.prod
    environment:
      NGINX_ENVSUBST_TEMPLATE_DIR: /etc/nginx/templates-prod
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.prod.d
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # 6 時間ごとに reload して新しい証明書を読む。CMD が "nginx" で始まらないと
    # entrypoint が envsubst しないので、ここで自分で展開する。
    command:
      - /bin/sh
      - -c
      - >-
        /docker-entrypoint.d/20-envsubst-on-templates.sh &&
        { while :; do sleep 6h & wait $${!}; nginx -c /etc/nginx/nginx.prod.conf -s reload; done; } &
        exec nginx -c /etc/nginx/nginx.prod.conf -g 'daemon off;'

  # 再起動ポリシーが無いと、ホストや Docker の再起動後に DB だけ戻らない。
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    profiles: ["letsencrypt"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # 12 時間ごと（certbot は期限の 30 日前まで何もしない）。

    entrypoint:
      - /bin/sh
      - -c
      - >-
        trap exit TERM;
        while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
        done;
