[project]
name = "d-party-backend"
version = "2.12.3"
description = "d-party backend — Django Channels powered watch-together service for dアニメストア"
authors = [{ name = "U-Not", email = "euno.eng@gmail.com" }]
requires-python = ">=3.15"
dependencies = [
    "django>=5.2,<7.0",
    "channels>=4.2",
    "channels-redis>=4.2,<4.4",
    "redis>=5,<9",
    "daphne>=4.1",
    "djangorestframework>=3.15",
    "djangochannelsrestframework>=1.2",
    "django-unfold>=0.100",
    "django-axes>=7.0",
    "django-extensions>=3.2.3",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "uvicorn[standard]>=0.34",
    "uvicorn-worker>=0.3",
    "python-dotenv>=1.0",
    "cryptography>=44.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "pip-licenses>=5.0",
    "pipdeptree>=2.23",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# linter は ruff に集約する（https://docs.astral.sh/ruff/rules/）。
#   E,W,F  pycodestyle + pyflakes      I      isort
#   S      flake8-bandit               N      pep8-naming
#   C90    mccabe（循環的複雑度）       PL     Pylint
#   DJ     flake8-django               UP     pyupgrade
#   B      flake8-bugbear              C4     flake8-comprehensions
#   SIM    flake8-simplify             RET    flake8-return
#   PT     flake8-pytest-style         ASYNC  flake8-async
#   DTZ    flake8-datetimez            LOG    flake8-logging
#   T20    flake8-print                TRY    tryceratops
#   PERF   Perflint                    FURB   refurb
#   PGH    pygrep-hooks                ISC    flake8-implicit-str-concat
#   TC     flake8-type-checking        EXE    flake8-executable
select = [
    "E", "W", "F", "I", "UP", "B", "DJ", "C4", "S",
    "C90", "PL", "N", "SIM", "RET", "PT", "ASYNC", "DTZ",
    "LOG", "T20", "TRY", "PERF", "FURB", "PGH", "ISC", "TC", "EXE",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults are idiomatic in Django/DRF
    "DJ008",  # __str__ on every model is optional here
    "TRY003", # long messages at the raise site are fine (and Django's own idiom)
]

# pydantic は実行時に注釈を解決するので、その import を TYPE_CHECKING へ移させない。
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The Channels ASGI entrypoint must initialise Django before importing routing.
"d_party/asgi.py" = ["E402"]
# PLC0415: models / settings have to be imported after django.setup().
"**/tests.py" = [
    "S101", "E711", "E721", "E722", "F811", "F841", "PLR2004", "PLC0415",
]
"**/test_*.py" = ["S101", "PLR2004", "PLC0415"]
"conftest.py" = ["S101", "PLC0415"]
"manage.py" = ["PLC0415"]

[tool.coverage.run]
# python-coverage-comment-action はリポジトリ相対のパスを要求する。
relative_files = true
omit = [
    "*/migrations/*",
    "manage.py",
    "*/tests.py",
    "*/test_*.py",
    "conftest.py",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "d_party.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.15"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true
# テストは factory-boy の動的属性を mypy が解決できないので外す。
exclude = [
    'migrations/',
    'manage\.py$',
    'tests\.py$',
    'test_.*\.py$',
    'conftest\.py$',
]

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

# consumers:
# - union-attr: None ガードの後でも await を挟むと mypy が narrowing を解除する。
# - arg-type: format.py のモデルへ dict を渡して pydantic に変換させている。
# - assignment: response_data を別の Send 型で使い回している。
[[tool.mypy.overrides]]
module = ["streamer.consumers"]
disable_error_code = ["union-attr", "arg-type", "assignment"]

[tool.django-stubs]
django_settings_module = "d_party.settings"
