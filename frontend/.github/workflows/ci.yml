name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client
        run: pnpm api:generate

      # The generated client is committed, so a stale checkout would silently
      # drift from openapi/openapi.json. Regenerate above, then fail if the
      # working tree changed.
      - name: Verify generated API client is up to date
        run: git diff --exit-code -- src/infrastructure/api/generated

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # storybook.yml only builds on main (to publish Pages). Building here as
      # well keeps a broken story from reaching main and breaking that deploy.
      - name: Build Storybook
        run: pnpm build-storybook
