# 開発用（`docker compose up` が自動で読む）。frontend は `pnpm dev`、
# django / postgres / redis のポートは loopback にだけ公開する。

services:
  django:
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:8000:8000"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  nginx:
    env_file:
      - ./.env.dev

  frontend:
    image: node:26-alpine
    # ロックファイルがルートにあるので、リポジトリ全体をマウントする。
    working_dir: /app/frontend
    env_file:
      - ./.env.dev
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      # node_modules はホストと混ぜない（musl 用のネイティブバイナリがある）。
      - ./:/app
      - frontend_root_node_modules:/app/node_modules
      - frontend_node_modules:/app/frontend/node_modules
      # .next もボリュームへ。WSL2 のバインドマウント上では rename が ENOENT で失敗し、
      # 全ページ 500 になる。
      - frontend_next:/app/frontend/.next
      - frontend_turbo:/app/.turbo
    command:
      - sh
      - -c
      # node:26-alpine は corepack を同梱しない。
      - npm install --global corepack@latest && corepack enable && pnpm install --frozen-lockfile --filter d-party-frontend... && exec pnpm dev -p 3000 -H 0.0.0.0
    # 初回は install とコンパイルで時間がかかる。
    healthcheck:
      start_period: 180s

volumes:
  frontend_root_node_modules: {}
  frontend_node_modules: {}
  frontend_next: {}
  frontend_turbo: {}
